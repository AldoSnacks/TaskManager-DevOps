<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>TaskManager</h1>
    <p>Gestión de tareas de TechSolutions</p>
  </header>

  <main>
    <section class="panel">
      <h2 id="titulo-form">Nueva tarea</h2>
      <form id="form-tarea" novalidate>
        <input type="hidden" id="tarea-id">
        <label for="nombre">Nombre *</label>
        <input type="text" id="nombre" maxlength="100" placeholder="Ej. Elaborar documentación">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" rows="3" placeholder="Detalles de la tarea"></textarea>
        <div class="fila">
          <div>
            <label for="prioridad">Prioridad</label>
            <select id="prioridad">
              {% for p in prioridades %}<option value="{{ p }}" {% if p == 'Media' %}selected{% endif %}>{{ p }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label for="estado">Estado</label>
            <select id="estado">
              {% for e in estados %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div class="acciones">
          <button type="submit" id="btn-guardar">Guardar tarea</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edición</button>
        </div>
      </form>
      <p id="mensaje" role="status"></p>
    </section>

    <section class="panel">
      <div class="encabezado-lista">
        <h2>Tareas</h2>
        <select id="filtro-estado" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          {% for e in estados %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
        </select>
      </div>
      <p id="resumen"></p>
      <ul id="lista-tareas"></ul>
    </section>
  </main>

  <script>window.ESTADOS = {{ estados|tojson }};</script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
